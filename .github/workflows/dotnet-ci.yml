name: .NET CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CmosCpuSimulator.slnx

      - name: Build
        run: dotnet build CmosCpuSimulator.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CmosCpuSimulator.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx

      - name: Publish terminal
        run: dotnet publish src/CmosCpu.Terminal/CmosCpu.Terminal.csproj --configuration Release --output artifacts/terminal

      - name: Upload terminal artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-release
          path: artifacts/terminal
